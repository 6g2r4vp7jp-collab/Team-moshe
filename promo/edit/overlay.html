<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team Moshe Overlay</title>
<link rel="stylesheet" href="../src/fonts/fonts.css">
<link rel="stylesheet" href="../src/fonts/montserrat.css">
<style>
  /* Instagram Reels safe area: nothing important above y=250, below y=1520, or right of x=940 */
  :root { --blue:#1e90ff; --ice:#9fd6ff; --white:#f7f6f2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  body { font-family:'Montserrat','Heebo',sans-serif; color:var(--white); }
  .layer { position:absolute; inset:0; }
  .fx { position:absolute; opacity:0; will-change:transform,opacity,filter,letter-spacing; }
  .center { left:0; right:0; text-align:center; }
  .sh { text-shadow:0 4px 24px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.8); }
  .name { font-weight:800; font-size:132px; letter-spacing:.26em; padding-left:.26em; line-height:1; }
  .line { height:3px; background:linear-gradient(90deg,transparent,var(--blue),transparent); box-shadow:0 0 14px rgba(30,144,255,.9); margin:0 auto; }
  .kick { font-weight:600; font-size:30px; letter-spacing:.55em; padding-left:.55em; color:var(--ice); }
  .title { left:90px; right:150px; text-align:left; }
  .title .big { font-weight:800; font-size:92px; line-height:.98; letter-spacing:.02em; }
  .title .big em { font-style:normal; color:var(--ice); }
  .title .bar { width:90px; height:6px; background:var(--blue); box-shadow:0 0 18px rgba(30,144,255,.8); margin-bottom:22px; }
  .stat { font-weight:700; font-size:40px; letter-spacing:.16em; }
  .stat b { color:var(--ice); font-weight:800; }
  .bar2 { position:absolute; left:0; right:0; height:200px; background:#000; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #black { position:absolute; inset:0; background:#000; opacity:0; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; }
  #grad { position:absolute; left:0; right:0; bottom:0; height:1000px; background:linear-gradient(0deg,rgba(0,0,0,.78),transparent); opacity:0; }
  #logoWrap { position:absolute; left:160px; top:300px; width:760px; height:760px; opacity:0; }
  #logoWrap img, #sweep, #halo { position:absolute; inset:0; width:100%; height:100%; }
  #halo { background:radial-gradient(closest-side, rgba(30,144,255,.33), rgba(30,144,255,.08) 55%, transparent 75%); transform:scale(1.3); }
  #sweep { -webkit-mask-image:url(../assets/team_moshe_logo.png); mask-image:url(../assets/team_moshe_logo.png); -webkit-mask-size:100% 100%; mask-size:100% 100%;
           background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%); background-size:300% 100%; mix-blend-mode:screen; }
  .heb { font-family:'Heebo',sans-serif; direction:rtl; }
</style>
</head>
<body>
<div id="grad"></div>
<div class="bar2" id="barT" style="top:-200px"></div>
<div class="bar2" id="barB" style="bottom:-200px"></div>
<div id="black"></div>
<div class="layer">
  <!-- COLD OPEN -->
  <div class="fx center name sh" id="name" style="top:1180px" data-in="2.75" data-out="4.0" data-fx="track">OR MOSHE</div>
  <div class="fx center" style="top:1330px" data-in="3.0" data-out="4.0" data-fx="wipe"><div class="line" style="width:620px"></div></div>

  <!-- FIGHTS -->
  <div class="fx title sh" style="top:1180px" data-in="7.0" data-out="8.45" data-fx="mask"><div class="bar"></div><div class="big">WORLD GAMES<br><em>CHAMPION</em></div></div>
  <div class="fx title sh" style="top:1180px" data-in="14.0" data-out="15.45" data-fx="mask"><div class="bar"></div><div class="big"><em>2×</em> EUROPEAN<br>CHAMPION</div></div>

  <!-- TEAM MOSHE -->
  <div class="fx center sh" style="top:1160px; font-weight:800; font-size:88px; letter-spacing:.12em; padding-left:.12em; white-space:nowrap" data-in="21.0" data-out="21.95" data-fx="track2">FROM THE RING</div>
  <div class="fx center sh" style="top:1110px; font-weight:800; font-size:96px; line-height:1.02; letter-spacing:.06em" data-in="22.0" data-out="24.4" data-fx="mask">TO THE NEXT<br><span style="color:var(--ice)">GENERATION</span></div>

  <!-- VICTORIES -->
  <div class="fx center stat sh" style="top:1250px" data-in="41.0" data-out="43.8" data-fx="rise">WORLD GAMES CHAMPION <b>2022</b></div>
  <div class="fx center stat sh" style="top:1310px" data-in="41.35" data-out="43.8" data-fx="rise"><b>2×</b> EUROPEAN CHAMPION</div>
  <div class="fx center stat sh" style="top:1370px" data-in="41.7" data-out="43.8" data-fx="rise"><b>3×</b> WORLD SILVER MEDALIST</div>
  <div class="fx center stat sh" style="top:1430px" data-in="42.05" data-out="43.8" data-fx="rise"><b>18×</b> ISRAELI CHAMPION</div>

  <!-- LOGO -->
  <div id="logoWrap"><div id="halo"></div><img src="../assets/team_moshe_logo.png"><div id="sweep"></div></div>
  <div class="fx center kick sh" style="top:1135px" data-in="45.0" data-out="99" data-fx="rise">MUAY THAI · KICKBOXING</div>
  <div class="fx center heb sh" style="top:1195px; font-size:44px; font-weight:500; color:#fff" data-in="45.4" data-out="99" data-fx="rise">קיבוץ לוחמי הגטאות</div>
</div>
<div id="flash"></div>
<div id="fade"></div>
<script>
const DURATION = 49;
const FLASH_AT = [4.0, 21.0, 33.0];
const GRAD = [[2.6,4.0],[7.0,8.5],[14.0,15.5],[21.0,24.5],[40.9,44.0]];
const LETTERBOX = [[0.0,4.0]];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a)), eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
const items=[...document.querySelectorAll('.fx')].map(el=>({el,tin:+el.dataset.in,tout:+el.dataset.out,fx:el.dataset.fx}));
function apply(it,t){
  const {el,tin,tout,fx}=it;
  if(t<tin-0.01||t>tout+0.01){el.style.opacity=0;return;}
  const life=t-tin, outP=eOut(seg(t,tout-0.22,tout));
  let op=1,tx=0,ty=0,sc=1,blur=0,clip='none',ls=null;
  if(fx==='track'){const p=eOut(seg(life,0,1.1)); op=clamp(p*1.6); blur=(1-p)*14; ls=lerp(.6,.26,p)+'em'; sc=lerp(1.06,1,p);}
  else if(fx==='track2'){const p=eOut(seg(life,0,0.5)); op=p; blur=(1-p)*10; ls=lerp(.35,.12,p)+'em';}
  else if(fx==='rise'){const p=eOut(seg(life,0,0.45));op=p;ty=(1-p)*30;blur=(1-p)*5;}
  else if(fx==='wipe'){const p=eIO(seg(life,0,0.6));clip=`inset(0 ${(1-p)*50}% 0 ${(1-p)*50}%)`;}
  else if(fx==='mask'){const p=eOut(seg(life,0,0.45));clip=`inset(${(1-p)*100}% 0 0 0)`;ty=(1-p)*40;}
  op*=1-outP; blur+=outP*8;
  el.style.opacity=op; el.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  el.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:'';
  el.style.clipPath=clip; if(ls) el.style.letterSpacing=ls;
}
function seek(t){
  items.forEach(i=>apply(i,t));
  let fl=0; for(const h of FLASH_AT){const d=t-h; if(d>=0&&d<0.35) fl+=Math.exp(-d*16)*0.8;}
  let g=0; for(const [a,b] of GRAD){ g=Math.max(g, Math.min(seg(t,a,a+0.3), 1-seg(t,b-0.3,b))); }
  let lb=0; for(const [a,b] of LETTERBOX){ lb=Math.max(lb, Math.min(1, 1-eIO(seg(t,b-0.12,b)))); }
  $('barT').style.transform=`translateY(${lb*200}px)`; $('barB').style.transform=`translateY(${-lb*200}px)`;
  const R=44.0;
  let black = seg(t,43.55,43.95);
  if(t>=R) black = lerp(1, 0.3, eOut(seg(t,R+0.3,R+2.2)));
  $('black').style.opacity=black;
  if(t>=R-0.01){
    const p=seg(t,R,R+0.45), s=lerp(1.3,1,eOut(p))*(1+0.02*seg(t,R+0.45,DURATION));
    const lw=$('logoWrap'); lw.style.opacity=clamp(p*2.5)*(1-seg(t,DURATION-0.6,DURATION));
    lw.style.transform=`scale(${s})`; lw.style.filter=`blur(${((1-p)*16).toFixed(2)}px) drop-shadow(0 0 ${lerp(70,24,seg(t,R,R+1.6))}px rgba(30,144,255,${lerp(.95,.5,seg(t,R,R+1.6))})) brightness(1.1)`;
    const sw=seg(t,R+0.35,R+1.45), sw2=seg(t,47.0,47.9);
    $('sweep').style.backgroundPosition=`${lerp(100,-50,sw<1?sw:sw2)}% 0`;
    $('sweep').style.opacity=(sw>0&&sw<1)||(sw2>0&&sw2<1)?1:0;
    $('halo').style.opacity=0.6+0.4*Math.exp(-(t-R)*2.5);
    fl += (t-R<0.4)? Math.exp(-(t-R)*10)*1.1 : 0;
  } else { $('logoWrap').style.opacity=0; }
  $('flash').style.opacity=clamp(fl*0.7,0,0.85);
  $('grad').style.opacity=g;
  $('fade').style.opacity=Math.max(1-seg(t,0,0.5), seg(t,DURATION-0.6,DURATION));
}
window.seek=seek; window.DURATION=DURATION;
window.ready=Promise.all([document.fonts.ready, ...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{seek(0);return true;});
</script>
</body>
</html>
