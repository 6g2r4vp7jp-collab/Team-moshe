<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#eef0f3}
  .stage{width:1200px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#e4e7ec 75%);font-family:Montserrat,Arial,sans-serif}
  .row{display:flex;gap:40px}
  .cap{text-align:center;color:#6b7280;font-size:15px;letter-spacing:.3em;font-weight:600;margin-top:6px}
  h1{margin:0 0 26px;font:800 30px Montserrat,Arial;letter-spacing:.35em;color:#0d1117}
  h1 span{color:var(--accent)}
</style>
</head>
<body>
<div class="stage">
  <h1>TEAM <span>MOSHE</span> · <b id="vname"></b></h1>
  <div class="row">
    <div><svg id="front" width="520" height="660" viewBox="0 0 500 640"></svg><div class="cap">FRONT</div></div>
    <div><svg id="back" width="520" height="660" viewBox="0 0 500 640"></svg><div class="cap">BACK</div></div>
  </div>
</div>
<script>
// Edit NAME / NUM to personalise the back of the jersey.
const NAME = 'MOSHE', NUM = '1';

// Design variants: ?v=1 … ?v=5
const VARIANTS = {
  1: {title:'BLACK CLASSIC', base:'#0c0e12', hi:'#2a2f38', lo:'#050608', accent:'#2f8fd0', accent2:'#7cc4f2',
      ink:'#ffffff', trimOuter:'#ffffff', pattern:'shards', tagline:'MUAY THAI · KICKBOXING'},
  2: {title:'HOME WHITE', base:'#f4f6f9', hi:'#ffffff', lo:'#d5dbe3', accent:'#1f6fb2', accent2:'#0f2a47',
      ink:'#0f2a47', trimOuter:'#0f2a47', pattern:'panel', tagline:'MUAY THAI · KICKBOXING', logoBadge:true},
  3: {title:'NAVY RETRO', base:'#101a2e', hi:'#22314f', lo:'#080e1a', accent:'#e9dcc0', accent2:'#c23b3b',
      ink:'#e9dcc0', trimOuter:'#c23b3b', pattern:'panelRetro', tagline:'EST. TEAM MOSHE GYM'},
  4: {title:'ELECTRIC BLUE', base:'#1468b8', hi:'#3b93e0', lo:'#0b3f73', accent:'#0c0e12', accent2:'#bfe4ff',
      ink:'#ffffff', trimOuter:'#0c0e12', pattern:'brush', tagline:'MUAY THAI · KICKBOXING', logoBadge:true},
  5: {title:'ISRAEL EDITION', base:'#f7f8fa', hi:'#ffffff', lo:'#d9dee6', accent:'#0038b8', accent2:'#0038b8',
      ink:'#0038b8', trimOuter:'#0038b8', pattern:'flag', tagline:'צוות משה', hebrew:true, logoBadge:true},
};
const vId = new URLSearchParams(location.search).get('v') || '1';
const V = VARIANTS[vId];
document.getElementById('vname').textContent = V.title;
document.documentElement.style.setProperty('--accent', V.title==='HOME WHITE'||V.title==='ISRAEL EDITION' ? V.accent : (vId==='3'?'#c23b3b':'#2f8fd0'));

function sidePattern(id){
  const A=V.accent, B=V.accent2, mir=(pts)=>pts.map(([x,y])=>`${500-x},${y}`).join(' ');
  const pt=(pts)=>pts.map(([x,y])=>`${x},${y}`).join(' ');
  if (V.pattern==='shards'){
    const s=[[[40,300],[95,250],[110,262],[48,330]],[[40,380],[118,300],[126,318],[42,420]],
             [[40,470],[100,410],[108,428],[44,505]],[[44,560],[130,470],[136,492],[60,592]]];
    return s.map((p,i)=>`<polygon points="${pt(p)}" fill="${i%2?B:A}" opacity=".85"/><polygon points="${mir(p)}" fill="${i%2?B:A}" opacity=".85"/>`).join('');
  }
  if (V.pattern==='panel' || V.pattern==='panelRetro'){
    const w1 = V.pattern==='panel' ? A : A, w2 = B;
    return `<rect x="30" y="230" width="40" height="400" fill="${w1}"/><rect x="70" y="230" width="7" height="400" fill="${w2}"/>
            <rect x="430" y="230" width="40" height="400" fill="${w1}"/><rect x="423" y="230" width="7" height="400" fill="${w2}"/>`;
  }
  if (V.pattern==='brush'){
    const strokes=[[38,330,112,270,24],[38,410,118,350,16],[40,500,120,430,28],[44,590,125,520,16]];
    return `<g filter="url(#rough-${id})">`+strokes.map(([x1,y1,x2,y2,w],i)=>
      `<path d="M${x1},${y1} Q${(x1+x2)/2},${(y1+y2)/2+20} ${x2},${y2}" stroke="${i%2?B:A}" stroke-width="${w}" stroke-linecap="round" fill="none" opacity=".9"/>
       <path d="M${500-x1},${y1} Q${500-(x1+x2)/2},${(y1+y2)/2+20} ${500-x2},${y2}" stroke="${i%2?B:A}" stroke-width="${w}" stroke-linecap="round" fill="none" opacity=".9"/>`).join('')+`</g>`;
  }
  if (V.pattern==='flag'){
    return `<rect x="0" y="490" width="500" height="22" fill="${A}"/><rect x="0" y="540" width="500" height="22" fill="${A}"/>`;
  }
  return '';
}

function jersey(svg, side){
  const front = side==='front', id=side;
  const neckDepth = front ? 112 : 52;
  const body = `M135,25 Q162,14 190,22 C198,${neckDepth} 302,${neckDepth} 310,22 Q338,14 365,25
    C372,140 410,222 460,245 L456,588 Q250,628 44,588 L40,245 C90,222 128,140 135,25 Z`;
  const neck = `M190,22 C198,${neckDepth} 302,${neckDepth} 310,22`;
  const armL = `M135,25 C128,140 90,222 40,245`;
  const armR = `M365,25 C372,140 410,222 460,245`;
  const A=V.accent, ink=V.ink;
  const nameFont = V.hebrew ? "'Secular One',sans-serif" : "Anton,Impact,sans-serif";

  const badge = V.logoBadge ? `<circle cx="250" cy="242" r="126" fill="#0c0e12"/><circle cx="250" cy="242" r="126" fill="none" stroke="${A}" stroke-width="4"/>` : '';
  const content = front ? `
      ${badge}
      <image href="logo_transparent.png" x="${V.logoBadge?155:138}" y="${V.logoBadge?146:128}" width="${V.logoBadge?190:224}" height="${V.logoBadge?191:225}" />
      ${V.hebrew
        ? `<text x="250" y="422" text-anchor="middle" font-family="'Secular One',sans-serif" font-size="52" fill="${ink}">צוות משה</text>
           <text x="250" y="454" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="13" letter-spacing="6" fill="${A}">TEAM MOSHE</text>`
        : `<text x="250" y="${V.logoBadge?416:402}" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="46" letter-spacing="6"
              fill="${ink}" stroke="${A}" stroke-width="1.2">TEAM MOSHE</text>
           <rect x="168" y="${V.logoBadge?430:416}" width="164" height="2.5" fill="${A}"/>
           <text x="250" y="${V.logoBadge?456:442}" text-anchor="middle" font-family="Montserrat,Arial" font-weight="800" font-size="12.5"
              letter-spacing="5" fill="${V.accent2}">${V.tagline}</text>`}`
    : `
      <text x="250" y="112" text-anchor="middle" font-family="Montserrat,Arial" font-weight="800" font-size="12"
            letter-spacing="6" fill="${V.pattern==='brush'?'#bfe4ff':A}">TEAM MOSHE</text>
      <text x="250" y="178" text-anchor="middle" font-family="${nameFont}" font-size="${V.hebrew?62:58}" letter-spacing="${V.hebrew?0:8}"
            fill="${ink}">${V.hebrew?'משה':NAME}</text>
      <text x="250" y="420" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="250"
            fill="${A}" stroke="${A}" stroke-width="18" stroke-linejoin="round">${NUM}</text>
      <text x="250" y="420" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="250"
            fill="${V.pattern==='flag'||V.pattern==='panel'?'#ffffff':ink}" stroke="${V.base}" stroke-width="6" stroke-linejoin="round">${NUM}</text>
      ${V.pattern==='flag' ? '' : `<g transform="translate(250,520)" fill="none" stroke="${A}" stroke-width="3">
        <polygon points="0,-22 19,11 -19,11"/><polygon points="0,22 19,-11 -19,-11"/></g>`}`;

  svg.innerHTML = `
  <defs>
    <clipPath id="clip-${id}"><path d="${body}"/></clipPath>
    <radialGradient id="shade-${id}" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="${V.hi}"/><stop offset=".6" stop-color="${V.base}"/><stop offset="1" stop-color="${V.lo}"/>
    </radialGradient>
    <pattern id="mesh-${id}" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r=".9" fill="${V.base.startsWith('#f')?'#000':'#fff'}" opacity=".05"/>
    </pattern>
    <filter id="drop-${id}" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".28"/>
    </filter>
    <filter id="glow-${id}"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rough-${id}"><feTurbulence type="fractalNoise" baseFrequency=".06 .5" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/></filter>
  </defs>
  <g filter="url(#drop-${id})"><path d="${body}" fill="url(#shade-${id})"/></g>
  <g clip-path="url(#clip-${id})">
    <path d="${body}" fill="url(#mesh-${id})"/>
    ${sidePattern(id)}
    ${V.pattern==='flag' ? '' : `<path d="M44,572 Q250,612 456,572" stroke="${A}" stroke-width="5" fill="none" opacity=".9"/>`}
    ${content}
  </g>
  ${[neck,armL,armR].map(d=>`
    <path d="${d}" stroke="${V.trimOuter}" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="${A==='#0c0e12'?'#ffffff':A}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="${V.base}" stroke-width="2" fill="none"/>`).join('')}
  ${front?'':`<rect x="236" y="38" width="28" height="18" rx="2" fill="${V.base.startsWith('#f')?'#0c0e12':'#fff'}" opacity=".9"/><text x="250" y="51" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="9" fill="${V.base.startsWith('#f')?'#fff':'#0c0e12'}">TM</text>`}
  `;
}
jersey(document.getElementById('front'),'front');
jersey(document.getElementById('back'),'back');
</script>
</body>
</html>
