<!doctype html>
<html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../promo/src/fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "השריון" - animated short, 1080x1920. window.seek(t) draws the frame at time t (seconds).
const W = 1080, H = 1920, GROUND = 1400, DURATION = 28.5;
window.DURATION = DURATION;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const back = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const P = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

const C = {
  out: '#2a1810', skin: '#f3c3a4', skinD: '#dda083', hair: '#3a2216', beard: '#6a3a22', beardD: '#4e2a18',
  shirt: '#3d9be9', shirtD: '#2c78bd', shorts: '#cdb487', shortsD: '#a88f63', shoe: '#f5f5f5',
  helmet: '#e63946', helmetD: '#9d1b22', frame: '#203a5c', amber: '#c98a3a', lens: '#2c1a10',
  tz: '#fffdf4', tzOut: '#8c8475', blue: '#3a66b8'
};

// ---------- primitives ----------
function circ(x, y, r, fill, stroke, lw = 6) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function ell(x, y, rx, ry, rot, fill, stroke, lw = 6) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function poly(pts, w, col, cap = 'round') { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = cap; ctx.lineJoin = 'round'; ctx.stroke(); }
function limb(pts, w, col, ow = 10) { poly(pts, w + ow, C.out); poly(pts, w, col); }
function shape(fn, fill, stroke = C.out, lw = 6) { ctx.beginPath(); fn(); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); } }
function rrect(x, y, w, h, r, fill, stroke = C.out, lw = 6) { shape(() => ctx.roundRect(x, y, w, h, r), fill, stroke, lw); }
function star(x, y, r, n, inner, rot, fill, stroke, lw = 5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i * PI / n, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// two-bone IK; picks the joint whose offset from `a` best matches the preferred direction
function ik(a, t, l1, l2, pref) {
  const dx = t[0] - a[0], dy = t[1] - a[1];
  const d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1, l1 + l2 - 1);
  const base = Math.atan2(dy, dx), ang = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  const dot = j => (j[0] - a[0]) * pref[0] + (j[1] - a[1]) * pref[1];
  return [dot(j1) > dot(j2) ? j1 : j2, [a[0] + d * Math.cos(base), a[1] + d * Math.sin(base)]];
}
function text(str, x, y, size, fill, stroke, sw = 14, weight = 900, family = 'Heebo') {
  ctx.font = `${weight} ${size}px ${family}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

// ---------- background ----------
function cloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const [dx, dy, r] of [[0, 0, 60], [55, -25, 55], [110, 0, 50], [55, 15, 55], [-45, 10, 40]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); ctx.fill(); }
}
function building(x, i, base) {
  const w = 220 + hash(i) * 30, h = 420 + hash(i + 5) * 380;
  const cols = ['#efe5d3', '#e6d6bb', '#f4eee4', '#dccbad', '#ece2d0'];
  const col = cols[Math.floor(hash(i + 2) * cols.length)];
  rrect(x, base - h, w, h + 20, 4, col, '#8a7a62', 4);
  // windows + shutters
  const floors = Math.floor((h - 60) / 95);
  for (let f = 0; f < floors; f++) {
    const wy = base - h + 40 + f * 95;
    for (let k = 0; k < 2; k++) {
      const wx = x + 30 + k * (w / 2);
      rrect(wx, wy, w / 2 - 60, 55, 3, hash(i * 7 + f * 3 + k) > .4 ? '#9fc6d9' : '#c9b48f', '#7d6e58', 3);
      if (hash(i * 3 + f + k * 9) > .55) rrect(wx + w / 2 - 75, wy + 38, 34, 24, 2, '#f0f0f0', '#888', 2); // AC unit
    }
    poly([[x + 10, wy + 72], [x + w - 10, wy + 72]], 4, '#a69477');
  }
  // dud-shemesh on the roof
  if (hash(i + 11) > .25) {
    const rx = x + 40 + hash(i + 13) * (w - 140);
    shape(() => { ctx.moveTo(rx, base - h); ctx.lineTo(rx + 70, base - h - 50); ctx.lineTo(rx + 85, base - h - 40); ctx.lineTo(rx + 20, base - h); }, '#2b3f6b', '#1b2440', 3);
    rrect(rx + 30, base - h - 32, 70, 26, 13, '#f2f2f2', '#888', 3);
  }
}
function palm(x, base, s) {
  ctx.save(); ctx.translate(x, base); ctx.scale(s, s);
  const top = [40, -520];
  for (let k = 0; k < 13; k++) { const u = k / 13, p = [Math.sin(u * 1.6) * 40, -u * 520]; ell(p[0], p[1], 26 - u * 8, 22, 0, k % 2 ? '#9a7146' : '#86603a', null); }
  ctx.lineCap = 'round';
  for (let k = 0; k < 7; k++) {
    const a = -PI / 2 + (k - 3) * 0.55, len = 190;
    ctx.beginPath(); ctx.moveTo(top[0], top[1]);
    ctx.quadraticCurveTo(top[0] + Math.cos(a) * len * .6, top[1] + Math.sin(a) * len * .6 - 40, top[0] + Math.cos(a) * len, top[1] + Math.sin(a) * len + 60);
    ctx.lineWidth = 30; ctx.strokeStyle = k % 2 ? '#3f8f3a' : '#2f7a33'; ctx.stroke();
  }
  ctx.restore();
}
function street(camX, blur) {
  if (blur) ctx.filter = 'blur(7px)';
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#4fb0f2'); g.addColorStop(1, '#d6efff');
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, GROUND + 60);
  const sg = ctx.createRadialGradient(870, 230, 20, 870, 230, 260);
  sg.addColorStop(0, 'rgba(255,250,200,1)'); sg.addColorStop(.35, 'rgba(255,240,170,.6)'); sg.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = sg; ctx.fillRect(600, 0, 480, 520);
  const cf = camX * .06, c0 = Math.floor(cf / 520) - 1;
  for (let i = c0; i < c0 + 4; i++) cloud(i * 520 - cf + hash(i) * 200, 160 + hash(i + 9) * 300, .9 + hash(i + 3) * .6);
  const base = GROUND - 140, bf = camX * .3, bw = 255, b0 = Math.floor(bf / bw) - 1;
  for (let i = b0; i < b0 + 7; i++) building(i * bw - bf, i, base);
  const pf = camX * .62, pw = 560, p0 = Math.floor(pf / pw) - 1;
  // back sidewalk
  ctx.fillStyle = '#d4cdbf'; ctx.fillRect(-60, base, W + 120, 90);
  for (let i = p0; i < p0 + 4; i++) palm(i * pw - pf + 120, base + 30, .95);
  ctx.strokeStyle = '#b9b1a1'; ctx.lineWidth = 3;
  for (let k = Math.floor(camX / 90) - 1; k < Math.floor(camX / 90) + 14; k++) { const x = k * 90 - camX; poly([[x, base], [x - 20, base + 90]], 3, '#bdb4a3'); }
  // red-white curb
  const cy = GROUND - 50;
  for (let k = Math.floor(camX / 80) - 1; k < Math.floor(camX / 80) + 16; k++) { ctx.fillStyle = k % 2 ? '#e8e8e8' : '#d8323c'; ctx.fillRect(k * 80 - camX, cy, 81, 22); }
  // road
  ctx.fillStyle = '#4b4f58'; ctx.fillRect(-60, cy + 22, W + 120, 300);
  for (let k = Math.floor(camX / 200) - 1; k < Math.floor(camX / 200) + 8; k++) { ctx.fillStyle = '#f1f1f1'; ctx.fillRect(k * 200 - camX, GROUND + 140, 110, 14); }
  for (let k = Math.floor(camX / 80) - 1; k < Math.floor(camX / 80) + 16; k++) { ctx.fillStyle = k % 2 ? '#e8e8e8' : '#d8323c'; ctx.fillRect(k * 80 - camX, GROUND + 272, 81, 22); }
  ctx.fillStyle = '#cfc7b8'; ctx.fillRect(-60, GROUND + 294, W + 120, H);
  for (let k = Math.floor(camX / 110) - 1; k < Math.floor(camX / 110) + 12; k++) poly([[k * 110 - camX, GROUND + 294], [k * 110 - camX - 40, H]], 3, '#b8af9e');
  ctx.filter = 'none';
}
function rock(x) {
  shape(() => { ctx.moveTo(x - 55, GROUND + 2); ctx.lineTo(x - 45, GROUND - 38); ctx.lineTo(x - 10, GROUND - 58); ctx.lineTo(x + 30, GROUND - 48); ctx.lineTo(x + 55, GROUND - 15); ctx.lineTo(x + 50, GROUND + 2); }, '#8d8a85', C.out, 5);
  poly([[x - 20, GROUND - 40], [x + 5, GROUND - 30]], 4, '#6c6964');
}
function bollard(x) {
  const top = GROUND - 210;
  rrect(x - 34, top, 68, 215, 10, '#bdbab3', C.out, 6);
  for (let k = 0; k < 3; k++) { ctx.fillStyle = k % 2 ? '#eee' : '#d8323c'; ctx.fillRect(x - 31, top + 12 + k * 26, 62, 26); }
  ell(x, top + 4, 34, 10, 0, '#d2cfc8', C.out, 5);
}
function ramp(x) {
  shape(() => { ctx.moveTo(x, GROUND + 4); ctx.lineTo(x + 260, GROUND - 110); ctx.lineTo(x + 268, GROUND + 4); }, '#c08a4b', C.out, 6);
  for (let k = 1; k < 5; k++) poly([[x + k * 52, GROUND + 2], [x + k * 52, GROUND - k * 22 + 4]], 3, '#9a6a35');
}
function dust(x, y, t, n = 6, spread = 80) {
  for (let k = 0; k < n; k++) {
    const u = clamp(t), a = hash(k + 3) * PI + PI;
    const r = 18 + u * 40 * (0.6 + hash(k)), px = x + Math.cos(a) * spread * u * (0.5 + hash(k + 1)), py = y + Math.sin(a) * 40 * u;
    ctx.globalAlpha = (1 - u) * .8; circ(px, py, r, '#d9d2c3'); ctx.globalAlpha = 1;
  }
}
function speedLines(t, alpha = .6) {
  ctx.globalAlpha = alpha;
  for (let k = 0; k < 9; k++) {
    const y = 300 + hash(k) * 1000, len = 140 + hash(k + 4) * 200, x = W - ((t * 2400 + hash(k + 8) * 2000) % (W + 600));
    poly([[x, y], [x + len, y]], 6, '#ffffff');
  }
  ctx.globalAlpha = 1;
}

// ---------- side view: bike ----------
const RW = [-170, -95], FW = [178, -95], BB = [-5, -118], HIP = [-55, -338];
function wheel(c, rot) {
  circ(c[0], c[1], 95, null, C.out, 30); circ(c[0], c[1], 95, null, '#262626', 22);
  circ(c[0], c[1], 74, null, '#a7b1bc', 7);
  for (let k = 0; k < 8; k++) { const a = rot + k * PI / 4; poly([[c[0], c[1]], [c[0] + Math.cos(a) * 72, c[1] + Math.sin(a) * 72]], 3, '#c9d0d8'); }
  circ(c[0], c[1], 12, '#555', C.out, 3);
}
function bike(o) {
  const wr = o.wheelRot || 0;
  wheel(RW, wr); wheel(FW, wr);
  circ(RW[0], RW[1], 26, '#333', C.out, 4); // hub motor
  // fenders
  ctx.beginPath(); ctx.arc(RW[0], RW[1], 112, PI * 1.1, PI * 1.75); ctx.lineWidth = 9; ctx.strokeStyle = '#333'; ctx.stroke();
  ctx.beginPath(); ctx.arc(FW[0], FW[1], 112, PI * 1.25, PI * 1.9); ctx.stroke();
  const ST = [-62, -300], HT = [138, -312], HB2 = [150, -262];
  for (const [a, b] of [[RW, BB], [RW, ST], [BB, [-70, -305]], [ST, HT], [HB2, BB]]) limb([a, b], 16, C.frame, 8);
  // battery on downtube
  ctx.save(); ctx.translate((HB2[0] + BB[0]) / 2, (HB2[1] + BB[1]) / 2); ctx.rotate(Math.atan2(BB[1] - HB2[1], BB[0] - HB2[0]));
  rrect(-75, -27, 150, 34, 10, '#151515', C.out, 4); circ(48, -10, 5, '#3ee06b'); circ(34, -10, 5, '#3ee06b'); circ(20, -10, 5, '#3ee06b');
  ctx.restore();
  limb([HT, FW], 11, '#8d96a0', 7); limb([HT, HB2], 18, C.frame, 8);
  limb([HT, [122, -388]], 10, '#555', 6); limb([[122, -388], [88, -384]], 13, '#222', 6);
  rrect(152, -310, 26, 18, 6, '#ffe28a', C.out, 3); // headlight
  limb([[-70, -305], [-80, -335]], 9, '#666', 6);
  rrect(-122, -350, 82, 22, 11, '#222', C.out, 4); // saddle
  limb([RW, [-150, -230], [-230, -228]], 6, '#555', 5); // rack
  // cranks
  const pa = o.pedal || 0, pn = [BB[0] + Math.cos(pa) * 45, BB[1] + Math.sin(pa) * 45];
  circ(BB[0], BB[1], 26, '#9aa2ab', C.out, 4);
  limb([BB, pn], 8, '#333', 5); rrect(pn[0] - 18, pn[1] - 5, 36, 10, 3, '#222', null);
}

// ---------- side view: rider (origin = hip) ----------
function ridePose(pedal, handsUp) {
  const bb = [BB[0] - HIP[0], BB[1] - HIP[1]];
  return {
    sh: [70, -192], hd: [104, -268],
    hN: handsUp ? [118, -395] : [147, -47], hF: handsUp ? [70, -400] : [141, -51],
    fN: [bb[0] + Math.cos(pedal) * 45, bb[1] + Math.sin(pedal) * 45],
    fF: [bb[0] + Math.cos(pedal + PI) * 45, bb[1] + Math.sin(pedal + PI) * 45]
  };
}
const FLY = { sh: [12, -195], hd: [28, -272], hN: [52, -405], hF: [18, -400], fN: [28, 268], fF: [-10, 262] };
function mixPose(a, b, u) { const r = {}; for (const k in a) r[k] = P(a[k], b[k], u); return r; }

function headSide(c, r, o) {
  const [cx, cy] = c;
  // hair back bumps (outline pass, then fill)
  const bumps = [];
  for (let k = 0; k < 9; k++) { const a = PI * .82 + k * (PI * .95 / 8); bumps.push([cx + Math.cos(a) * r * .9, cy + Math.sin(a) * r * .9, r * .36]); }
  for (const b of bumps) circ(b[0], b[1], b[2] + 4, C.out);
  circ(cx, cy, r, C.skin, C.out, 6);
  for (const b of bumps) circ(b[0], b[1], b[2], C.hair);
  ell(cx - .1 * r, cy + .1 * r, .16 * r, .22 * r, 0, C.skin, C.out, 4);
  // beard
  shape(() => {
    ctx.moveTo(cx + .02 * r, cy + .12 * r);
    ctx.quadraticCurveTo(cx + .05 * r, cy + .95 * r, cx + .55 * r, cy + 1.05 * r);
    ctx.quadraticCurveTo(cx + 1.02 * r, cy + 1.0 * r, cx + 1.0 * r, cy + .42 * r);
    ctx.quadraticCurveTo(cx + .6 * r, cy + .3 * r, cx + .25 * r, cy + .3 * r);
  }, C.beard, C.out, 4);
  circ(cx + r * .98, cy + r * .1, r * .17, C.skin, C.out, 4); // nose
  ctx.fillStyle = C.skin; ctx.fillRect(cx + r * .8, cy - r * .02, r * .16, r * .22);
  // mouth
  const m = o.mouth || 'smile';
  if (m === 'smile' || m === 'yell') {
    const open = m === 'yell' ? .35 : .22;
    shape(() => { ctx.moveTo(cx + .6 * r, cy + .5 * r); ctx.quadraticCurveTo(cx + .78 * r, cy + (.5 + open * 2) * r, cx + 1.0 * r, cy + .48 * r); }, '#7a1f1f', C.out, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(cx + .66 * r, cy + .5 * r, .3 * r, .09 * r);
  } else if (m === 'ouch') {
    rrect(cx + .62 * r, cy + .45 * r, .36 * r, .2 * r, 4, '#fff', C.out, 4); poly([[cx + .62 * r, cy + .55 * r], [cx + .98 * r, cy + .55 * r]], 2, C.out);
  } else ell(cx + .82 * r, cy + .58 * r, .1 * r, .14 * r, 0, '#7a1f1f', C.out, 4);
  // sunglasses
  poly([[cx + .6 * r, cy - .16 * r], [cx - .02 * r, cy - .02 * r]], 6, C.amber);
  ell(cx + .76 * r, cy - .14 * r, .2 * r, .24 * r, 0, C.lens, C.amber, 6);
  ell(cx + .8 * r, cy - .2 * r, .05 * r, .08 * r, .5, 'rgba(255,255,255,.7)');
  poly([[cx + .5 * r, cy - .45 * r], [cx + .9 * r, cy - .43 * r]], 7, C.hair); // brow
  if (o.helmet) {
    shape(() => { ctx.ellipse(cx - .04 * r, cy - .18 * r, r * 1.16, r * 1.02, 0, PI * .98, PI * 2.02); }, C.helmet, C.out, 6);
    poly([[cx - 1.18 * r, cy - .14 * r], [cx + 1.1 * r, cy - .2 * r]], 10, C.helmetD);
    for (let k = 0; k < 3; k++) { const a = PI * 1.3 + k * .22; poly([[cx + Math.cos(a) * r * .6, cy - .2 * r + Math.sin(a) * r * .55], [cx + Math.cos(a) * r * .95, cy - .2 * r + Math.sin(a) * r * .85]], 7, C.helmetD); }
    shape(() => { ctx.moveTo(cx + .9 * r, cy - .32 * r); ctx.lineTo(cx + 1.35 * r, cy - .28 * r); ctx.lineTo(cx + 1.0 * r, cy - .12 * r); }, '#222', C.out, 4);
    poly([[cx - .15 * r, cy - .1 * r], [cx + .3 * r, cy + .95 * r]], 4, '#222');
  } else {
    // front curls on top
    for (const [a, s] of [[-1.3, .34], [-1.0, .3], [-.75, .26], [-1.7, .34], [-2.1, .34]]) circ(cx + Math.cos(a) * r * .88, cy + Math.sin(a) * r * .88, r * s, C.hair, C.out, 3);
    for (const [a, s] of [[-1.3, .3], [-1.0, .26], [-1.7, .3], [-2.1, .3]]) circ(cx + Math.cos(a) * r * .88, cy + Math.sin(a) * r * .88, r * s, C.hair);
  }
}
function tzSide(o) {
  // strings from the hip, wind blows to world-left; o.rot = total rotation so strings stay world-aligned
  const wind = clamp(o.wind ?? 1), T = o.t || 0, rot = o.rot || 0;
  const wd = [lerp(0, -1, wind), lerp(1, .18, wind)], n = Math.hypot(wd[0], wd[1]);
  const dw = [wd[0] / n, wd[1] / n], d = [dw[0] * Math.cos(-rot) - dw[1] * Math.sin(-rot), dw[0] * Math.sin(-rot) + dw[1] * Math.cos(-rot)];
  const pp = [-d[1], d[0]];
  for (let i = 0; i < 4; i++) {
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const s = k / 8 * 165, wob = Math.sin(T * 19 - k * 1.1 + i * 1.7) * k * 2.6 * (.3 + wind) + (i - 1.5) * k * 1.6;
      pts.push([-8 + i * 7 + d[0] * s + pp[0] * wob, 22 + d[1] * s + pp[1] * wob]);
    }
    poly(pts, 9, C.tzOut); poly(pts, 5, i === 1 ? C.blue : C.tz);
    poly(pts.slice(0, 4), 11, C.tz);
  }
}
function riderSide(p, o, part) {
  const hip = [0, 0];
  if (part !== 'front') {
    const [k, e] = ik(hip, p.fF, 140, 135, [1, -.2]);
    limb([hip, k], 50, C.shortsD); limb([k, e], 36, C.skinD); ell(e[0] + 14, e[1] + 4, 32, 15, 0, '#d6d6d6', C.out, 5);
    const [el, h] = ik(p.sh, p.hF, 100, 95, [0, 1]);
    limb([p.sh, el, h], 30, C.skinD); circ(h[0], h[1], 17, C.skinD, C.out, 4);
  }
  if (part !== 'back') {
    // torso
    const ang = Math.atan2(p.sh[1], p.sh[0]), L = Math.hypot(p.sh[0], p.sh[1]);
    ctx.save(); ctx.rotate(ang);
    circ(0, 0, 58, C.shorts, C.out, 6);
    rrect(18, -58, L + 20, 116, 48, C.shirt, C.out, 6);
    ell(L * .42, 32, L * .36, 46, 0, C.shirt, null);
    ctx.beginPath(); ctx.ellipse(L * .42, 32, L * .36, 46, 0, 0, PI); ctx.lineWidth = 6; ctx.strokeStyle = C.out; ctx.stroke();
    ctx.restore();
